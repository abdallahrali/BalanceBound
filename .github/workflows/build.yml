name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        # --onefile: Create a single EXE
        # --additional-hooks-dir: (Optional if standard hooks don't catch everything)
        # --collect-all: Ensures all streamlit dependencies are included
        pyinstaller --noconfirm --onefile --windowed `
        --collect-all streamlit `
        --collect-all plotly `
        --add-data "data;data" `
        --add-data "ui;ui" `
        --add-data "logic;logic" `
        --add-data "config.py;." `
        --add-data "app.py;." `
        --copy-metadata streamlit `
        --name "BalanceBound" `
        run_app.py

    - name: Upload Executable
      uses: actions/upload-artifact@v3
      with:
        name: BalanceBound-Windows
        path: dist/BalanceBound.exe
